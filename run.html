    const el = document.getElementById('progress');
    setTabHint(tab, 'running');
    setStatus(el, runPrefix() + 'Queueing…');
    const payload = JSON.parse(JSON.stringify(prompt));
    const rolled = applyRandomSeeds(payload);
    if (rolled.length) {
        tab.seed = rolled[0].seed;
        renderTabStrip();
        logLine(`run ${i} of ${runTotal} seed ${rolled.map(s => `#${s.id}=${s.seed}`).join(', ')}`);
    }
    logLine(`run ${i} of ${runTotal} POST ${base}/prompt (${Object.keys(payload).length} nodes)`);
    persistRemix();
    try {
        if (runStopped) return;
        const resp = await colabFetch(base + '/prompt', {
            method: 'POST',
            mode: 'cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt: payload, client_id: clientId }),
        }, { label: '/prompt', statusNoun: 'prompt', tries: 6 });
        if (runStopped) return;
        const body = await resp.json().catch(() => ({}));
        if (!resp.ok) {
            if (body.node_errors) logLine(JSON.stringify(body.node_errors, null, 2), 'err');
            const detail = body.error || (body.node_errors ? JSON.stringify(body.node_errors) : ('HTTP ' + resp.status));
            throw new Error(typeof detail === 'string' ? detail : JSON.stringify(detail));
        }
        const promptId = body.prompt_id;
        if (!promptId) throw new Error('No prompt_id from ComfyUI');
        runPromptId = promptId;
        tab.promptId = promptId;
        const number = body.number != null ? ` queue #${body.number}` : '';
        logLine(`run ${i} of ${runTotal} prompt_id ${promptId}${number}`, 'ok');
        updateRunMeta();
        persistRemix();
        if (runStopped) return;
        await pollHistory(base, promptId);
        if (runStopped) {
            setTabHint(tab, 'stopped');
            return;
        }
        logLine(`run ${i} of ${runTotal} complete`, 'ok');
        setTabHint(tab, 'done');
        setBar(i, runTotal);
    } catch (err) {
        setTabHint(tab, 'error');
        if (runStopped) return;
        if (runTotal > 1) throw new Error(`Run ${i} of ${runTotal} failed: ${err.message || err}`);
        throw err;
    }
}

async function pollHistory(base, promptId) {
    const el = document.getElementById('progress');
    const histUrl = `${base}/history/${promptId}`;
    const tick = async () => {
        if (runStopped) return true;
        ensureRunSocket(base);
        await fetchQueue(base);
        if (runStopped) return true;
        const resp = await colabFetch(histUrl, { mode: 'cors' }, {
            label: '/history/' + promptId, statusNoun: 'history', tries: 8,
        });
        if (resp.status === 404) {
            setStatus(el, runPrefix() + (runNode ? ('Running ' + nodeLabel(runNode)) : 'Queued…'));
            updateRunMeta();
            return false;
        }
        if (!resp.ok) throw new Error('history HTTP ' + resp.status);
        let data;
        try { data = await resp.json(); } catch (err) {
            throw isNetworkFetchError(err) ? err : new Error('history JSON unreadable');
        }
        const entry = data[promptId];
        if (!entry) {
            setStatus(el, runPrefix() + (runNode ? ('Running ' + nodeLabel(runNode)) : 'Queued…'));
            updateRunMeta();
            return false;
        }
        const status = entry.status || {};
        logHistoryStatus(status);
        if (status.status_str === 'error' || (Array.isArray(status.messages) && status.messages.some(m => m[0] === 'execution_error'))) {
            if (runStopped) return true;
            const errMsg = status.messages?.find(m => m[0] === 'execution_error');
            const detail = errMsg?.[1]?.exception_message || JSON.stringify(status.messages || status).slice(0, 600);
            throw new Error(detail);
        }
        const files = outputFiles(entry.outputs);
        if (files.length) {
            showOutputs(base, files);
            const stills = files.filter(f => !isVideoFile(f.filename));
            if (stills.length && !status.completed) {
                setStatus(el, runPrefix() + 'Preview still · video still encoding');
            }
        }
        if (status.completed) {
            const secs = elapsedText();
            logLine(`${runPrefix()}finished in ${secs}` + (files.length ? ` · ${files.map(f => f.filename).join(', ')}` : ''), 'ok');
            setStatus(el, runPrefix() + `finished · ${secs}`);
            if (runTotal > 1) setBar(runIndex, runTotal);
            else setBar(1, 1);
            return true;
        }
        const hasStill = files.some(f => !isVideoFile(f.filename));
        const hasVideo = files.some(f => isVideoFile(f.filename));
        if (hasStill && !hasVideo) {
            setStatus(el, runPrefix() + 'Preview still · video still encoding');
        } else {
            setStatus(el, runPrefix() + (runNode ? ('Running ' + nodeLabel(runNode)) : 'Running…'));
        }
        updateRunMeta();
        return false;
    };
    for (let i = 0; i < 600; i++) {
        if (runStopped) return;
        try {
            if (await tick()) return;
        } catch (err) {
            if (runStopped) return;
            const msg = String((err && err.message) || err || '');
            if (msg === 'stopped') return;
            const retryable = isNetworkFetchError(err)
                || /unreachable|failed to fetch|history JSON unreadable|history HTTP (404|408|429|5\d\d)/i.test(msg);
            if (!retryable) throw err;
            logLine(`history poll: ${msg} · will keep retrying`);
            setStatus(el, runPrefix() + 'Colab unreachable, retrying history…');
            ensureRunSocket(base);
        }
        const tab = execTab();
        const outs = (tab ? tab.lastOutputs : lastOutputs) || [];
        const hasStill = (tab && tab.livePreviewUrl) || livePreviewUrl || outs.some(f => !isVideoFile(f.filename));
        await waitPollDelay(hasStill ? 1500 : 400);
        if (runStopped) return;
    }
    throw new Error('Timed out waiting for ComfyUI (15 min)');
}

async function runPrompt() {
    const el = document.getElementById('progress');
    const base = colabUrl();
    if (!base) { setStatus(el, 'Paste a Colab URL first', 'err'); return; }
    if (!workflow.prompt) { setStatus(el, 'No prompt loaded', 'err'); return; }
    if (runActive || runLoopBusy) {
        enqueueStandby();
        return;
    }
    await startQueuedJob(snapshotJob());
}

async function startQueuedJob(job) {
    const el = document.getElementById('progress');
    const base = colabUrl();
    if (!base) { setStatus(el, 'Paste a Colab URL first', 'err'); return; }
    if (!job || !job.prompt) { setStatus(el, 'No prompt loaded', 'err'); return; }
    const prompt = job.prompt;
    const seedEl = document.getElementById('randomSeed');
    if (seedEl && job.randomSeed != null) seedEl.checked = !!job.randomSeed;
    runTotal = Math.min(20, Math.max(1, Number(job.runCount) || 1));
    runCount = runTotal;
    runIndex = 0;
    runStopped = false;
    runActive = true;
    runLoopBusy = true;
    setRunButtons(true);
    persistRemix();
    connectRunSocket(base);
    logLine(`starting ${job.name || 'remix'}` + (runTotal > 1 ? ` · ${runTotal} runs` : ''));
    setStatus(el, runTotal > 1 ? `Run 1 of ${runTotal} · Queueing…` : 'Queueing…');
    try {
        for (let i = 1; i <= runTotal; i++) {
            if (runStopped) break;
            await executeOneRun(base, prompt, i);
        }
        if (!runStopped) finishBatchOk();
    } catch (err) {
        if (!runStopped) {
            logLine(String(err.message || err), 'err');
            setStatus(el, String(err.message || err), 'err');
        }
    } finally {
        runActive = false;
        runLoopBusy = false;
        setRunButtons(false);
        closeRunSocket();
        updateRunMeta();
        persistRemix();
        if (!runStopped) drainStandby();
    }
}

document.getElementById('colabUrl').value = localStorage.getItem(COLAB_KEY) || '';
document.getElementById('runCount').addEventListener('change', persistRemix);
document.getElementById('randomSeed').addEventListener('change', persistRemix);
document.getElementById('runTabs').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-tab]');
    if (!btn) return;
    selectTab(btn.getAttribute('data-tab'));
    persistRemix();
});
document.getElementById('standbyList').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-cancel-standby]');
    if (!btn) return;
    cancelStandby(btn.getAttribute('data-cancel-standby'));
});
document.getElementById('outputs').addEventListener('click', onOutputMediaClick);
document.getElementById('lightboxClose').addEventListener('click', closeMediaLightbox);
document.getElementById('mediaLightbox').addEventListener('click', (e) => {
    if (e.target.id === 'mediaLightbox') closeMediaLightbox();
});
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeMediaLightbox();
});
window.addEventListener('pagehide', persistRemix);
window.addEventListener('visibilitychange', () => { if (document.hidden) persistRemix(); });
loadWorkflow();
</script>
