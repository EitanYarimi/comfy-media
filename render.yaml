services:
  - type: web
    name: comfy-media
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: STORAGE_MODE
        value: drive
      - key: MEDIA_PREWARM
        value: "0"
      - key: MEDIA_CACHE_DIR
        value: /tmp/comfy-media-cache
      - key: DRIVE_ROOT_FOLDER_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: SITE_PASSWORD
        sync: false
      - key: VIDEO_DIR
        value: output/video
      - key: PHOTO_DIRS
        value: output
